# ClashParty / mihomo 完整配置（规则集在线订阅版）
# 规则走 jsDelivr 镜像，国内可直连；若 jsDelivr 不通请改用 windows（自包含版）
# 来源规则：https://github.com/hxlex/fenliu
#
# ⚠️ 这是模板。使用前请把下面 5 个占位符替换成你自己的值
#    （在 3x-ui 面板点节点的「二维码 / 分享链接」即可拿到）：
#
#      YOUR_SERVER_DOMAIN      ← 服务器域名
#      YOUR_UUID               ← id
#      YOUR_REALITY_PUBLIC_KEY ← pbk
#      YOUR_SHORT_ID           ← sid
#      www.amazon.com          ← sni（servername）
#
#    填好后另存为本地文件，不要提交回这个公开仓库。

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 30
# Windows 下查进程名需要管理员权限，strict 容易卡住连接，这里关掉
find-process-mode: 'off'
global-client-fingerprint: chrome
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  # 关键：不要缓存 fake-ip。旧缓存会把节点域名记成 198.18.x.x，导致节点永远超时
  store-fake-ip: false

sniffer:
  enable: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.YOUR_SERVER_DOMAIN'

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  prefer-h3: false
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.YOUR_SERVER_DOMAIN'          # 节点域名，必须排除
    - '*.lan'
    - '*.localdomain'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
    - 'localhost.ptlogin2.qq.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 明文 UDP 放前面：部分网络会拦截 DoH(443)，只写 DoH 会让所有解析超时
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
  # 专门解析节点域名，绕开 fake-ip
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: "MyNode"
    type: vless
    server: YOUR_SERVER_DOMAIN
    port: 443
    uuid: YOUR_UUID
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.amazon.com
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_REALITY_PUBLIC_KEY
      short-id: YOUR_SHORT_ID
      # Xray-core v26.9.8+ 要求 ClientHello 带 X25519MLKEM768 key share，
      # 否则握手被静默丢给 fallback，客户端表现为超时。
      # 3x-ui 的 Clash 订阅会自动加这行，手写 yaml 必须自己补上。
      support-x25519mlkem768: true

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 自动选择
      - "MyNode"
      - DIRECT
  - name: AI
    type: select
    proxies:
      - PROXY
      - "MyNode"
      - DIRECT
  - name: TikTok
    type: select
    proxies:
      - PROXY
      - "MyNode"
      - DIRECT
  - name: 社交媒体
    type: select
    proxies:
      - PROXY
      - "MyNode"
      - DIRECT
  - name: 自动选择
    type: url-test
    url: 'http://cp.cloudflare.com/generate_204'
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    proxies:
      - "MyNode"

rule-providers:
  chuguo:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/chuguo.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/chuguo.yaml
    path: ./rules/chuguo.yaml
  PrivateTracker:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/PrivateTracker.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/PrivateTracker.yaml
    path: ./rules/PrivateTracker.yaml
  AppleIntelligence:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/AppleIntelligence.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/AppleIntelligence.yaml
    path: ./rules/AppleIntelligence.yaml
  grok:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/grok.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/grok.yaml
    path: ./rules/grok.yaml
  AI:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/AI.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/AI.yaml
    path: ./rules/AI.yaml
  TikTok:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/TikTok.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/TikTok.yaml
    path: ./rules/TikTok.yaml
  SocialMedia:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    # 备用地址: https://raw.githubusercontent.com/hxlex/fenliu/main/clash/SocialMedia.yaml
    url: https://cdn.jsdelivr.net/gh/hxlex/fenliu@main/clash/SocialMedia.yaml
    path: ./rules/SocialMedia.yaml

rules:
  # 节点域名直连，防止回环
  - DOMAIN-SUFFIX,YOUR_SERVER_DOMAIN,DIRECT
  # 规则集下载域名直连
  - DOMAIN-SUFFIX,jsdelivr.net,DIRECT
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY
  # Windows 网络连通性检测走直连
  - DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,msftncsi.com,DIRECT

  - RULE-SET,chuguo,PROXY
  - RULE-SET,PrivateTracker,DIRECT
  - RULE-SET,AppleIntelligence,AI
  - RULE-SET,grok,AI
  - RULE-SET,AI,AI
  - RULE-SET,TikTok,TikTok
  - RULE-SET,SocialMedia,社交媒体

  # 兜底
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
